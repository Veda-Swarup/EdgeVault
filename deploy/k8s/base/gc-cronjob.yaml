apiVersion: batch/v1
kind: CronJob
metadata:
  name: edgevault-gc
  namespace: edgevault
spec:
  schedule: "17 3 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: edgevault-gc
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            runAsGroup: 65532
            seccompProfile:
              type: RuntimeDefault
          containers:
            - name: gc
              image: __EDGEVAULT_IMAGE__
              imagePullPolicy: IfNotPresent
              command: ["/app/gc"]
              args: ["--dry-run"]
              envFrom:
                - configMapRef:
                    name: edgevault-config
              env:
                - name: EDGEVAULT_DB_URL
                  valueFrom:
                    secretKeyRef:
                      name: edgevault-runtime
                      key: database-url
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
