services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: edgevault
      POSTGRES_PASSWORD: edgevault
      POSTGRES_DB: edgevault
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgevault"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pg_data:
