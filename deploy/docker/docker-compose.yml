services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: edgevault
      POSTGRES_PASSWORD: edgevault
      POSTGRES_DB: edgevault
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edgevault"]
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    # Silo is a maintained MinIO-compatible fork; the upstream MinIO image is
    # no longer anonymously pullable from Quay.
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot container: creates the two S3 buckets on first start.
  # Uses the minio client bundled inside the MinIO server image.
  minio-init:
    image: docker.io/pgsty/silo:RELEASE.2026-10-26T00-00-00Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/edgevault-chunks &&
        mc mb --with-lock --ignore-existing local/edgevault-protected-snapshots &&
        echo 'buckets ready'
      "
    restart: "no"

volumes:
  pg_data:
  minio_data:
